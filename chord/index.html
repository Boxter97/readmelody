<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="코드 진행을 보고 박자에 맞춰 쳐 본 다음, 피아노 소리로 정답을 확인하는 코드 초견 연습">
<title>코드 초견 | 기타 MasTer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Black+Han+Sans&family=Noto+Music&display=swap">
<style>body{margin:0}[hidden]{display:none!important}

/* 레이아웃: 머리 띠 → 연습 설정판(단계 카드·모드·박자·키) → 흰 악보 → 재생 버튼 */
:root{
  --bg:#FFFFFF; --ink:#18202E; --muted:#5B6372; --line:#DCE1E8; --tile:#F3F5F8;
  --accent:#2B55C9; --accent-soft:#E9EEFB; --accent-shadow:rgba(43,85,201,.25); --accent-glow:rgba(43,85,201,.16);
  --hard:#E8461F; --hard-soft:#FFD2C6; --hard-bg:#FFF1EC; --star:#FFB400; --star-off:#DDE2EA;
  --f-body:'IBM Plex Sans KR',system-ui,sans-serif;
  --f-disp:'Black Han Sans','IBM Plex Sans KR',sans-serif;
  --f-music:'Noto Music','Bravura',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55}
button{font:inherit;cursor:pointer}
.band{border-bottom:1.5px solid var(--line);background:linear-gradient(180deg,var(--accent-soft),var(--bg))}
.band .in{max-width:1080px;margin:0 auto;padding-block:26px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:16px}
.mark{width:56px;height:56px;border-radius:16px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark span{font-family:var(--f-music);font-size:40px;line-height:1;color:#fff;margin-top:6px}
.mark svg{width:48px;height:48px;fill:#fff} .mark svg .h{fill:var(--accent)}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance}
h1.logo{font-family:var(--f-disp);font-weight:400;font-size:36px;letter-spacing:.01em;line-height:1.1} h1.logo img{display:block;height:92px;width:auto;margin:-6px 0 -6px -5px}
.how{margin:4px 0 0;color:var(--muted);font-size:17px}
.wrap{max-width:1080px;margin:0 auto;padding-block:22px 44px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

.panel{display:flex;flex-direction:column;gap:14px;padding:18px 20px;border-radius:18px;background:var(--tile)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px}
.field{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.label{font-size:15px;font-weight:700;color:var(--muted);min-width:44px}

/* 단계 카드 */
.stagewrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:stretch}
#levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}   /* 6단계 + 랜덤 = 7칸: 좁은 화면은 4칸씩 두 줄 */
.stage{position:relative;text-align:left;border:2px solid var(--line);border-radius:18px;padding:14px 14px 12px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;gap:4px;min-width:0;container:card/inline-size}
.stage .top{display:flex;align-items:center;gap:7px;min-width:0}
.stage .num{font-family:var(--f-disp);font-size:36px;line-height:1}
.stage .sym{position:absolute;right:12px;top:10px;font-family:var(--f-music);font-size:32px;line-height:1;color:#B7BFCD}
.stage .name{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage.rnd .stars{visibility:hidden}
.stars{display:flex;gap:2px;margin-top:2px} .stars svg{width:15px;height:15px;fill:var(--star-off)} .stars svg.on{fill:var(--star)}
.prog{display:flex;align-items:center;gap:8px;margin-top:4px}
.prog .pbar{flex:1;margin-top:0}
.cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden} .pbar i{display:block;height:100%;width:0;background:var(--accent)}
.stage[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 8px 20px var(--accent-glow)}
.stage[aria-pressed="true"] .num,.stage[aria-pressed="true"] .sym{color:var(--accent)}
/* Hard 표시: 숫자 옆에 붙여서 카드 크기가 Easy와 같게. 카드가 좁으면 ♯♭로 짧게 */
.hardtag{display:none;color:var(--hard);font-size:15px;font-weight:700;line-height:1;white-space:nowrap}
.hardtag .full{display:none}
.hard .hardtag{display:inline}
@container card (min-width:130px){ .hardtag .full{display:inline} .hardtag .short{display:none} }
@media (min-width:721px){ @container card (max-width:85.98px){ .hard .hardtag{display:none} } }  /* 광고를 켜서 카드가 아주 좁아지면 아이콘과 겹치지 않게 숨김 */
.hard .wrap{--accent:var(--hard);--accent-soft:var(--hard-bg);--accent-shadow:rgba(232,70,31,.28);--accent-glow:rgba(232,70,31,.16)}
/* 모드: 단계 카드와 같은 테두리 카드 안에 Easy/Hard를 하나의 이어 붙인 버튼으로 */
.modebox{display:flex;flex-direction:column;gap:8px;padding:12px 12px 12px;border:2px solid var(--line);border-radius:18px;background:var(--bg)}
.modebox .label{min-width:0}
#modes{display:flex;flex-direction:column;flex:1;min-width:112px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
#modes button{flex:1;min-height:46px;padding:0 16px;border:0;border-bottom:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:18px;color:var(--muted)}
#modes button:last-child{border-bottom:0}
#modes button[aria-pressed="true"][data-v="easy"]{background:var(--accent);color:var(--bg)}
#modes button[aria-pressed="true"][data-v="hard"]{background:var(--hard);color:var(--bg)}
.lvrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-top:-4px}
.lvdesc{font-size:16px;color:var(--muted)}
/* 연습 기록 초기화: 누르면 한 번 더 물어봄 */
.reset{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2px}
.reset [hidden]{display:none!important}
.rask{display:flex;flex-direction:column;align-items:center;gap:6px}
.rbtns{display:inline-flex;gap:6px}
.rq{font-size:14px;font-weight:700;color:var(--ink);text-align:center;line-height:1.3}
.rmsg{font-size:14px;font-weight:700;color:var(--accent)}
.rbtn{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);font-size:14px;font-weight:500;color:var(--muted)}
.rbtn svg{width:13px;height:13px;overflow:visible;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rbtn.danger{background:var(--hard);border-color:var(--hard);color:var(--bg);font-weight:700}


/* 이어 붙인 버튼 묶음 */
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.seg button{min-height:46px;padding:8px 16px;border:0;border-right:1.5px solid var(--line);background:var(--bg);font-size:17px;font-weight:500;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:700}
#keys button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:56px;padding:6px 13px;line-height:1.15}
#keys .kl{font-size:18px;font-weight:700}
#keys .ks{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
#keys button[aria-pressed="true"] .ks{color:var(--bg)}
.tempo{display:flex;align-items:center;gap:12px}
.tempo input{width:170px;accent-color:var(--accent)}
.tempo output{font-weight:700;font-variant-numeric:tabular-nums;min-width:72px}
.checks{display:flex;gap:10px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px 0 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);font-size:16.5px;font-weight:500;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:38px;height:24px;margin:0;border-radius:12px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.check input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(24,32,46,.3);transition:left .15s}
.check input:checked{background:var(--accent)}
.check input:checked::after{left:17px}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 설정: 악보 상자 · 연주 상자 */
.setgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:stretch}
.setbox{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg)}
.setbox h3{margin:0;font-size:15px;font-weight:700;color:var(--muted)}
.setbox .label{min-width:48px}
.scorebody{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}   /* 박자·마디는 왼쪽, 키는 오른쪽 */
.scoreleft{display:flex;flex-direction:column;gap:12px;flex:none}
.keyfield{align-items:stretch;flex:1 1 300px;min-width:0}
.keyfield .label{align-self:center;min-width:0}
.keys{display:flex;gap:8px;align-items:stretch;min-width:0;flex:1}
.keys .kc{display:flex} .keys .kc button{flex:1;height:auto;padding-left:8px;padding-right:8px}
.krows{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.krows .seg{display:flex;flex-wrap:nowrap} .krows .seg button{flex:1;min-width:0;padding-left:4px;padding-right:4px}
.setbox .tempo{flex-wrap:nowrap} .setbox .tempo input{flex:1;width:auto;min-width:80px}
@container (min-width:760.02px){   /* 컴퓨터: 악보 상자 빈 곳이 많아 버튼·글씨를 키움 */
  .scorebody{gap:14px 24px} .scoreleft{gap:14px}
  .scorebody .label{font-size:16px}
  .scorebody .seg button{min-height:50px;padding:8px 17px;font-size:17.5px}
  .krows{gap:12px} #keys .krows .seg button{min-height:56px;padding-left:4px;padding-right:4px}
  .keys{gap:10px} #keys .kc button{padding-left:14px;padding-right:14px}
  #keys .kl{font-size:18.5px} #keys .ks{font-size:13px}
}
.optlist{display:flex;flex-direction:column}
.optlist .check{flex-direction:row-reverse;justify-content:space-between;gap:12px;min-height:46px;padding:0;border:0;border-top:1.5px solid var(--line);border-radius:0;background:transparent;font-size:17px}
.optlist .check:first-child{border-top:0}
.optlist .check:has(input:checked){background:transparent;border-color:var(--line)}
.optlist .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1.5px solid var(--line)}   /* 도수·구성음 보기는 한 줄에 둘 */
.optlist .pair .check{border-top:0;min-width:0;white-space:nowrap}
.optlist .pair .check+.check{border-left:1.5px solid var(--line);padding-left:12px}
.optlist .pair .check:first-child{padding-right:12px}

/* 악보 */
.sheet{background:var(--bg);border:1.5px solid var(--line);border-radius:18px;padding:20px 14px 14px;box-shadow:0 10px 30px rgba(24,32,46,.07);overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 10px 6px;font-size:16px;color:var(--muted)}
.meta b{color:var(--ink)}
#score{display:block;width:100%;height:auto;color:var(--ink)}
#score .on .nh,#score .on .st{fill:var(--accent);stroke:var(--accent)}
#score .on text{fill:var(--accent)}
#score .on .hollow{fill:none}

.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px -14px -14px;padding:14px;border-top:1.5px solid var(--line);background:var(--tile)}   /* 악보 카드 아래쪽에 붙은 버튼 줄 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;color:var(--ink);white-space:nowrap}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.status{font-size:16px;color:var(--muted);min-height:1.5em}
.credit{margin:8px 0 0;font-size:14px;color:var(--muted)}

/* 광고 자리: 컴퓨터는 양옆 세로(160×600), 휴대폰·태블릿은 버튼 아래 가로(320×100). ads-off면 숨김 */
.layout{max-width:1448px;margin:0 auto}
.wrap{container-type:inline-size}
.ad{display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--line);border-radius:12px;background:var(--tile);color:var(--muted);font-size:15px;font-weight:700}
.ad small{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.ad-side{width:160px;height:600px}
.ad-bottom{width:100%;max-width:320px;height:100px;margin:0 auto}
@media (min-width:1024px){
  body:not(.ads-off) .layout{display:grid;grid-template-columns:160px minmax(0,1fr) 160px;gap:24px;align-items:start;
    padding-block:22px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body:not(.ads-off) .layout .wrap{max-width:none;margin:0;width:auto;padding-left:0;padding-right:0;padding-top:0}
  body:not(.ads-off) .ad-side{display:flex}
  body:not(.ads-off) .band .in{max-width:1448px;padding-left:calc(max(16px,env(safe-area-inset-left,0px)) + 184px);padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + 184px)}
}
@media (max-width:1023.98px){ body:not(.ads-off) .ad-bottom{display:flex} }
@container (max-width:760px){
  .setgrid{grid-template-columns:1fr}
  .stagewrap{grid-template-columns:1fr}
  .modebox{flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 12px;border-radius:14px} .reset{margin-top:0;flex:none} .rask{flex-direction:row;flex-wrap:wrap;justify-content:center} #modes{flex-direction:row;flex:1} #modes button{flex:1;min-width:0;border-bottom:0;border-right:1.5px solid var(--line)} #modes button:last-child{border-right:0}
}

@media (max-width:720px){
  .band .in{padding-block:18px 16px} h1{font-size:25px} h1.logo img{height:72px} .mark{width:46px;height:46px} .mark span{font-size:33px} .mark svg{width:40px;height:40px}
  .panel{padding:14px 12px}
  .stagewrap{grid-template-columns:1fr}
  #levels{gap:6px}
  .stage{padding:10px 4px 8px;border-radius:14px;align-items:center;text-align:center}
  .stage .num{font-size:28px} .stage .sym{position:static;font-size:24px;height:26px} .stage .name{display:none}
  .stars{gap:1px} .stars svg{width:10px;height:10px} .prog{flex-direction:column;align-items:center;gap:3px;width:100%} .prog .pbar{flex:none;width:80%} .cnt{font-size:13px}
  .pbar{width:80%}
  .stage .top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:0;width:100%} .stage .top .num{grid-column:2}
  .hardtag{grid-column:3;justify-self:start;margin-left:2px;font-size:13px}
  .lvdesc{flex-basis:100%}
  .modebox{flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:8px 12px;border-radius:14px} .reset{margin-top:0;flex:none} .rask{flex-direction:row;flex-wrap:wrap;justify-content:center} #modes{flex-direction:row;flex:1} #modes button{flex:1;min-width:0;border-bottom:0;border-right:1.5px solid var(--line)} #modes button:last-child{border-right:0}
  .seg button{padding:8px 12px}
  .setgrid{grid-template-columns:1fr} .setbox{padding:12px 12px 14px} .setbox .label{min-width:40px}
  #keys button{padding:6px 6px;min-width:36px}
  .tempo input{width:140px}
  .actions{gap:6px;margin:8px -14px -14px;padding:10px} .btn{min-height:50px;padding:0 6px;font-size:16px;gap:6px} .btn svg{width:15px;height:15px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

/* 맨 위 메뉴 (세 페이지 공통) */
.band .in{flex-wrap:wrap;row-gap:14px}
.brand{display:flex;align-items:center;gap:16px;color:inherit;text-decoration:none;margin-right:auto;min-width:0}
.nav{display:flex;gap:4px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:4px}
.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:10px;font-weight:700;font-size:17px;color:var(--muted);text-decoration:none;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav a:focus-visible,.brand:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:720px){ .nav{width:100%} .nav a{flex:1;padding:0 4px;font-size:15px} }

.stage .sym{font-family:var(--f-body);font-size:17px;font-weight:700;top:14px}
#score .chord.on text{fill:var(--accent)}
/* 넓은 화면: 카드를 조금 작게 해서 7칸 한 줄 */
@media (min-width:1000px){
  #levels{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .stage{padding:12px 10px 10px;border-radius:16px}
  .stage .num{font-size:30px} .stage .name{font-size:15px}
  .stage .sym{font-size:14px;top:12px;right:9px}
  .stars svg{width:12px;height:12px} .cnt{font-size:13px}
  .hardtag{font-size:13px} .hard .stage .hardtag{display:inline}
}
.hardtag{font-size:14px} @media (min-width:721px){ .stage .top{gap:6px} }          /* 코드 카드는 아이콘(sus4 등)이 넓어서 조금 작게 */
@media (max-width:720px){ .hardtag{font-size:12px;margin-left:1px} }
</style>
</head>
<body class="ads-off">
<div class="band"><div class="in">
  <a class="brand" href="../">
    <div><h1 class="logo"><img src="../logo.png" alt="기타 MasTer (Guitar MasTer)" width="190" height="100"></h1></div>
  </a>
  <nav class="nav" aria-label="메뉴">
    <a href="../">멜로디 초견</a>
    <a href="./" aria-current="page">코드 초견</a>
    <a href="../metronome/">메트로놈</a>
    <a href="../harmony/">화성학</a>
  </nav>
</div></div>

<div class="layout">
<aside class="ad ad-side" aria-label="광고">광고<small>160×600</small></aside>
<div class="wrap">
  <section class="panel" aria-label="설정">
    <div class="stagewrap">
      <div id="levels" role="group" aria-label="단계"></div>
      <div class="modebox"><span class="label">모드</span><div id="modes"></div><div class="reset">
          <span class="rmsg" id="resetMsg" role="status" hidden>초기화했어요</span>
          <button type="button" class="rbtn" id="resetBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>기록 초기화</button>
          <span class="rask" id="resetAsk" hidden><span class="rq">기록을 모두 지울까요?</span><span class="rbtns"><button type="button" class="rbtn danger" id="resetYes">초기화</button><button type="button" class="rbtn" id="resetNo">취소</button></span></span>

// 자주 쓰는 진행 (도수: 0=Ⅰ … 6=Ⅶ) — 이어 붙여서 곡을 만듦
const PATTERNS=[[3,2,1,0],[1,4,0,5],[0,5,1,4],[5,1,4,0],[2,5,1,4],[3,6,2,5],[0,3,6,2],[3,4,2,5],
  [0,5,3,4],[5,3,0,4],[0,2,3,4],[1,4,2,5],[3,4,0,5],[1,4,0,0],[0,1,2,3],[0,6,2,5],[2,5,3,4],[5,2,3,0],[3,0,1,4],[0,4,5,2,3,0,3,4],[3,6,2,5,1,4,0,0]];
function genDegrees(n){
  const seq=[]; let last=-1;
  for(let k=0;seq.length<n&&k<200;k++){
    const left=n-seq.length;
    const opts=PATTERNS.map((p,i)=>i).filter(i=>i!==last&&PATTERNS[i][0]!==seq[seq.length-1]&&(PATTERNS[i].length<=4||left>=8));
    last=rnd(opts); seq.push(...PATTERNS[last]);
  }
  seq.length=n;
  for(let i=1;i<n;i++) if(seq[i]===seq[i-1]) seq[i]=(seq[i]+3)%7;   // 같은 코드가 붙으면 바꾸기 (Ⅰ Ⅰ → Ⅰ Ⅳ)
  return seq.map(d=>({deg:d,q:d===4?'7':SEV_Q[d],inv:0}));         // 1단계부터 모두 7th 코드
}
function dimTo(t,key){             // 다음 코드 근음보다 반음 아래에서 시작하는 dim7 (C♯dim7 → Dm7)
  const tpc=rootOf({deg:t,alt:0},key).pc;
  const opt=d=>{ const nat=rootOf({deg:d,alt:0},key).pc; let alt=((tpc-1-nat)%12+12)%12; if(alt>6) alt-=12; return {deg:d,q:'dim7',inv:0,alt,feat:true}; };
  const a=opt((t+6)%7), b=opt(t), acc=c=>Math.abs(rootOf(c,key).acc);   // 읽기 쉬운 이름으로 (E♯dim7 대신 Fdim7)
  const c=acc(b)<acc(a)?b:a; c.rom=accTxt(a.alt)+ROMAN[a.deg]+'°7'; return c;    // 도수는 ♯Ⅳ°7처럼 (다음 코드로 반음 올라감)
}
const pickQ=a=>a[Math.floor(Math.random()*a.length)];
const tensionOf=d=>mode==='hard'&&(d===3||d===4)                 // Hard: 얼터드 텐션도 (Ⅳ ♯11, Ⅴ ♭9·♯9·♯11)
  ? (d===3?pickQ(['maj9','maj7♯11']):pickQ(['9','13','7♭9','7♯9','7♯11']))
  : [ Math.random()<0.5?'maj9':'maj13', Math.random()<0.5?'m9':'m11', 'm11', 'maj9', Math.random()<0.5?'9':'13', Math.random()<0.6?'m9':'m11', 'm7♭5(11)' ][d];
const allTension=()=>level===6&&sel!==0;        // 6단계: 모든 코드가 텐션코드 (K 요청 2026-11-11)
function decorate(seq,key){
  if(allTension()){ seq.forEach(c=>{ c.q=tensionOf(c.deg); c.inv=0; }); return; }
  const n=seq.length, P=(lv,p)=>sel===0?p*0.4:level<lv?0:(level===lv?p:p*0.5);   // 새로 배우는 코드는 자주, 앞 단계 코드는 가끔 (랜덤은 모든 단계 고루)
  for(let i=1;i<n-1;i++){
    const c=seq[i], nx=seq[i+1], cad=i===n-2;
    // 2단계: sus4
    if(c.deg===4&&Math.random()<P(2,0.45)){ c.q=Math.random()<0.5?'7sus4':'sus4'; continue; }
    if(c.deg===1&&mode==='hard'&&!cad&&Math.random()<P(2,0.25)){ c.q='7sus4'; continue; }   // Ⅱ7sus4는 Hard에서만 (Ⅰsus4는 안 씀)
    // 3단계: aug7 (Ⅴ → Ⅰ), dim7 (다음 코드로 반음 올라가며 이어짐)
    if(c.deg===4&&nx.deg===0&&Math.random()<P(3,0.45)){ c.q='aug7'; continue; }
    if(i<n-2&&i>0&&[0,1,4,5].includes(nx.deg)&&seq[i-1].q!=='dim7'&&Math.random()<P(3,0.4)){ seq[i]=dimTo(nx.deg,key); continue; }
    // 4단계: 분수코드
    if(!cad&&Math.random()<P(4,0.6)){
      if(c.deg===0&&(nx.deg===3||nx.deg===1)){ c.q=''; c.inv=1; continue; }            // C/E → F, Dm
      if(c.deg===0&&nx.deg===4){ c.q=''; c.inv=2; continue; }                               // C/G → G7
      if(c.deg===4&&(nx.deg===5||nx.deg===0)){ c.q=''; c.inv=1; continue; }            // G/B → Am, C
      if(c.deg===3&&nx.deg===4){ c.q=''; c.inv=1; continue; }                            // F/A → G
      if(c.deg===1&&nx.deg===4&&Math.random()<0.5){ c.q='m'; c.inv=1; continue; }                           // Dm/F → G
      if(c.deg===5&&nx.deg===1){ c.q='m'; c.inv=2; continue; }                           // Am/E → Dm
    }
    // 5단계: 6코드 (Ⅰ6 · Ⅳ6 · Ⅱm6)
    if(Math.random()<P(5,0.45)&&(c.deg===0||c.deg===3||c.deg===1)){ c.q=c.deg===1?'m6':'6'; continue; }
    // 6단계: 텐션코드
    if(Math.random()<P(6,0.55)){
      if(c.deg===0||c.deg===3) c.q='maj9';
      else if(c.deg===1) c.q=Math.random()<0.5?'m9':'m11';
      else if(c.deg===5) c.q='m9';
      else if(c.deg===4) c.q=Math.random()<0.5?'9':'13';
    }
  }
  if(level>=6&&(seq[n-1].deg===0||seq[n-1].deg===3)&&Math.random()<0.4) seq[n-1].q='maj9';
  seq.forEach(c=>{ if(c.inv||c.q==='dim7'||!(c.q===SEV_Q[c.deg]||(c.deg===4&&c.q==='7'))) c.feat=true; });
  // 그 단계 코드가 한 번도 안 나왔으면 알맞은 자리에 하나 넣기
  const has=q=>seq.some(c=>c.q===q);
  if((level===3||sel===0&&Math.random()<0.5)&&!has('aug7')){ const i=seq.findIndex((c,j)=>c.deg===4&&c.q!=='dim7'&&seq[j+1]&&seq[j+1].deg===0); if(i>=0){ seq[i].q='aug7'; seq[i].feat=true; } }
  if((level===3||sel===0&&Math.random()<0.5)&&!has('dim7')){ const c=[]; for(let i=1;i<n-1;i++) if([0,1,4,5].includes(seq[i+1].deg)&&seq[i+1].q!=='dim7'&&seq[i-1].q!=='dim7') c.push(i); if(c.length){ const i=rnd(c); seq[i]=dimTo(seq[i+1].deg,key); } }
  if((level===5||sel===0&&Math.random()<0.5)&&!seq.some(c=>c.q==='6'||c.q==='m6')){ const c=seq.filter(x=>[0,1,3].includes(x.deg)&&!x.feat); if(c.length){ const x=rnd(c); x.q=x.deg===1?'m6':'6'; x.feat=true; } }
  if((level===4||sel===0&&Math.random()<0.5)&&!seq.some(c=>c.inv)&&n>2){ const i=1+Math.floor(Math.random()*(n-2)); if(seq[i].q!=='dim7'&&!(sel===0&&seq[i].feat)){ seq[i].q=TRIAD_Q[seq[i].deg]; seq[i].inv=1; seq[i].feat=true; } }
}
function addColor(seq){            // Hard: 부속화음(Ⅴ7/x)과 차용화음(Ⅳm)
  const n=seq.length, cands=[];
  for(let i=1;i<n-2;i++){ const t=seq[i+1].deg; if([1,3,4,5].includes(t)&&seq[i+1].sec==null&&!seq[i].feat&&seq[i+1].q!=='dim7'&&seq[i-1].q!=='dim7') cands.push(i); }
  for(let i=cands.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cands[i],cands[j]]=[cands[j],cands[i]]; }
  const want=Math.max(1,Math.round(n/4)), used=new Set(); let cnt=0;
  for(const i of cands){
    if(cnt>=want) break;
    if(used.has(i-1)||used.has(i+1)) continue;
    const t=seq[i+1].deg; seq[i]={deg:(t+4)%7,q:allTension()?([1,5].includes(t)?pickQ(['7♭9','7♯9']):pickQ(['9','7♯11','13'])):'7',inv:0,sec:t}; used.add(i); cnt++;
  }
  for(let i=1;i<n-1;i++) if(seq[i].deg===3&&seq[i].sec==null&&!seq[i].feat&&!used.has(i)&&seq[i+1].deg===0&&Math.random()<0.5){ seq[i]={deg:3,q:allTension()?'m9':'m7',inv:0,borrowed:true}; cnt++; }
  return cnt;
}
function mixCount(seq){            // 랜덤: 몇 개 단계의 코드가 섞였는지 (2~6단계)
  return [seq.some(c=>c.q==='sus4'||c.q==='7sus4'), seq.some(c=>c.q==='aug7'||c.q==='dim7'), seq.some(c=>c.inv),
          seq.some(c=>c.q==='6'||c.q==='m6'), seq.some(c=>['maj9','m9','9','m11','13'].includes(c.q))].filter(Boolean).length;
}
function chordFeature(seq){        // 그 단계에서 새로 배우는 코드가 꼭 한 번은 나오게
  if(level===2) return seq.some(c=>c.q==='sus4'||c.q==='7sus4');
  if(level===3) return seq.some(c=>c.q==='aug7')&&seq.some(c=>c.q==='dim7');
  if(level===4) return seq.some(c=>c.inv);
  if(level===5) return seq.some(c=>c.q==='6'||c.q==='m6');
  if(level===6) return seq.some(c=>['maj9','m9','9','m11','13'].includes(c.q));
  return true;
}
function barSplits(M){              // 한 마디 안에서 코드가 시작하는 자리 (16분음표 단위)
  if(mode!=='hard') return [0];                                     // Easy: 한 마디에 코드 1개
  if(M.beat===6) return [0,6];                                      // 6/8: 2개 (점4분음표마다)
  const three=!allTension()&&Math.random()<0.4;                    // 6단계는 코드 이름이 길어서 2개까지 (3개면 악보가 작아짐)
  if(M.len===16) return three?[0,8,12]:[0,8];                       // 4/4: 2개는 1·3박, 3개는 1·3·4박
  return three?[0,4,8]:[0,8];                                       // 3/4: 2개는 1·3박, 3개는 1·2·3박
}
function makeSong(){
  const M=METERS[meter], key=KEYS[keyName];
  const segs=[], measures=[];
  for(let b=0;b<bars;b++){
    const ps=b===bars-1?[0]:barSplits(M), ev=[];                     // 마지막 마디는 으뜸화음 하나
    ps.forEach((pos,i)=>{ const e={bar:b,pos,dur:(ps[i+1]??M.len)-pos,cellStart:true,chordOnly:true,deg:6}; ev.push(e); segs.push({bar:b,pos,ev:e}); });
    measures.push(ev);
  }
  let seq, best=null, bestN=-1;
  const need=Math.min(5,Math.max(2,segs.length-2));                 // 랜덤: 코드 수에 맞게 여러 단계가 섞이도록
  for(let k=0;k<300;k++){
    seq=genDegrees(segs.length); decorate(seq,key);
    if(mode==='hard'&&addColor(seq)<1) continue;
    if(sel===0){ const m=mixCount(seq); if(m>bestN){ best=seq; bestN=m; } if(m>=need) break; continue; }
    if(chordFeature(seq)) break;
  }
  if(sel===0&&best) seq=best;
  segs.forEach((sg,i)=>{ sg.chord=seq[i]; sg.ev.chord=seq[i]; });
  return {key,M,measures,segs,tonicChord:{deg:0,q:'',inv:0}};
}

function pitchOf(deg,key,alt){
  const li=((deg%7)+7)%7, oct=4+Math.floor(deg/7), L=LETTERS[li];
  const acc=(key.acc[L]||0)+(alt||0);
  return {midi:12*(oct+1)+SEMI[li]+acc, name:NAME_KR[li]+(acc>0?'♯':acc<0?'♭':''), acc};
}

/* ---------- 악보 그리기 ---------- */
const S=12;                      // 줄 간격
const NS='http://www.w3.org/2000/svg';
const SPACE={1:1.9,2:2.5,3:2.9,4:3.2,6:3.8,8:4.4,12:5.2,16:5.8};   // 음표 길이별 기본 간격 (줄 간격 단위)
const FK=4*S/1000;               // 악보 글꼴 1000단위 = 줄 간격 4칸
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function glyph(g,name,cx,baseY,cls){       // 글꼴 모양을 가로 가운데 cx, 기준선 baseY에 놓기
  const G=GLYPH[name], mx=(G.b[0]+G.b[2])/2;
  return el('path',{class:cls||'nh',d:G.d,fill:'currentColor',transform:`translate(${cx-mx*FK} ${baseY}) scale(${FK} ${-FK})`},g);
}

function packSystems(natW,availFirst,availRest,maxPer,tol){
  const n=natW.length; let best=null;
  for(let mask=0;mask<(1<<(n-1));mask++){
    const groups=[]; let cur=[0];
    for(let i=1;i<n;i++){ if(mask&(1<<(i-1))){ groups.push(cur); cur=[i]; } else cur.push(i); }
    groups.push(cur);
    let ok=true, cost=0;
    for(let gi=0;gi<groups.length&&ok;gi++){
      const g=groups[gi], w=g.reduce((a,m)=>a+natW[m],0), fill=w/(gi===0?availFirst:availRest);
      if(g.length>maxPer||(fill>tol&&g.length>1)) ok=false;
      cost+=(1-Math.min(fill,1))**2;
    }
    if(!ok) continue;
    const score=groups.length*100+cost;
    if(!best||score<best.score) best={score,groups};
  }
  return best.groups;
}

let noteEls=[];
function render(){
  const svg=$('score'); svg.innerHTML=''; noteEls=[];
  const box=svg.parentElement.clientWidth-28;
  const narrow=box<520;
  const M=song.M, key=song.key;
  const ks=Object.keys(key.acc), sharp=ks.length>0&&key.acc[ks[0]]>0;
  const accs=(sharp?['F','C','G','D','A']:['B','E','A','D']).filter(l=>key.acc[l]);
  const x0=6, clefW=narrow?42:46, headW=clefW+accs.length*S*0.95+6, tsW=S*2.4;
  const tight=narrow?0.75:1, minSp=0;
  const sp=e=>S*Math.max((SPACE[e.dur]||3)*tight,minSp);
  const padL=S*0.6, padR=S*0.4;
  const lead=e=>e.sign?S*1.3:0;                                            // 임시표 자리
  // 코드 이름·도수·구성음의 실제 글자 너비를 재서 자리 잡기
  const ms=el('text',{x:0,y:-999,'font-family':'IBM Plex Sans KR, sans-serif'},svg);
  const wOf=(parts,fs,fw)=>{ ms.textContent=''; ms.setAttribute('font-size',fs); ms.setAttribute('font-weight',fw);
    parts.forEach(([txt,kind])=>el('tspan',kind==='acc'?{'font-family':'Noto Music, serif','font-size':S*1.55}:kind==='tacc'?{'font-family':'Noto Music, serif','font-size':S*(narrow?1.05:1.15)}:kind==='q'?{'font-size':S*(narrow?1.3:1.45)}:{},ms,txt));
    return ms.getComputedTextLength(); };
  const nameW=e=>Math.max(wOf(chordParts(e.chord,key),S*(narrow?1.75:1.95),700),
    showDeg?wOf([[romanOf(e.chord),'']],S*1.35,700):0, showTones?wOf([[toneNames(e.chord,key).join(' '),'']],S*1.18,500)*1.06:0)+S*1.2;   // + 여백
  const need=Math.max(...song.measures.map(ev=>padL+padR+Math.max(S*(narrow?8:10),...ev.map(e=>nameW(e)*M.len/e.dur))));
  const natW=song.measures.map(()=>need);                                   // 마디 너비는 모두 같게 (코드 자리 = 박 자리)
  // 한 줄에 늘 4마디 (종이 악보처럼). 다 안 들어가면 악보 전체를 작게 그림
  const W=Math.max(Math.max(box,300)/(narrow?0.84:1),x0+headW+tsW+4+need*4+6), x1=W-6;
  const systems=[]; for(let m=0;m<song.measures.length;m+=4) systems.push(song.measures.slice(m,m+4).map((_,i)=>m+i));
  ms.remove();
  const sysH=S*4+84+(showDeg?26:0)+(showTones?26:0), top=72;
  svg.setAttribute('viewBox',`0 0 ${W} ${top+systems.length*sysH}`);
  const sysInfo=[]; let prevF=1.6;

  systems.forEach((ms,li)=>{
    const g=el('g',{},svg), y0=top+li*sysH, mid=y0+2*S;
    const yOf=d=>y0+4*S-(d-2)*S/2;
    const staff=el('g',{},g);
    el('line',{x1:x0,x2:x0,y1:y0,y2:y0+4*S,stroke:'currentColor','stroke-width':1.4},g);
    el('text',{x:x0+6,y:yOf(4),'font-size':S*4,'font-family':'Noto Music, Bravura, serif',fill:'currentColor'},g,'\u{1D11E}');
    let x=x0+clefW;
    accs.forEach(l=>{
      const d=sharp?SHARP_POS[l]:FLAT_POS[l];
      el('text',{x,y:yOf(d)+(sharp?S*0.42:S*0.3),'font-size':S*2.6,'font-family':'Noto Music, serif',fill:'currentColor'},g,sharp?'♯':'♭');
      x+=S*0.95;
    });
    x+=6;
    if(li===0){
      [M.num,M.den].forEach((t,i)=>el('text',{x:x+S*0.9,y:y0+S*(i===0?2:4)-2,'font-size':S*2.35,'font-weight':700,'text-anchor':'middle','font-family':'IBM Plex Sans KR, sans-serif',fill:'currentColor'},g,String(t)));
      x+=tsW;
    }
    const start=x+4, tot=ms.reduce((a,m)=>a+natW[m],0), fullF=(x1-start)/tot;
    const f=(li===systems.length-1&&li>0)?Math.min(fullF,Math.max(1.6,prevF*1.1)):fullF;   // 마지막 줄만 마디가 적을 때 너무 늘이지 않기
    const endX=start+tot*f; prevF=f;
    sysInfo[li]={start,end:endX,y0};
    for(let i=0;i<5;i++) el('line',{x1:x0,x2:endX,y1:y0+i*S,y2:y0+i*S,stroke:'currentColor','stroke-width':1.1},staff);
    let mx=start;
    ms.forEach(m=>{
      const ev=song.measures[m], mw=natW[m]*f, bx=mx+mw;
      if(m===bars-1){
        el('line',{x1:bx-7,x2:bx-7,y1:y0,y2:y0+4*S,stroke:'currentColor','stroke-width':1.2},g);
        el('rect',{x:bx-4,y:y0,width:4,height:4*S,fill:'currentColor'},g);
      } else el('line',{x1:bx,x2:bx,y1:y0,y2:y0+4*S,stroke:'currentColor','stroke-width':1.2},g);

      ev.forEach(e=>{ e.x=mx+padL+e.pos/M.len*(mw-padL-padR); e.sys=li; e.y=yOf(e.deg); });   // 코드는 박 자리에 맞춰 (리듬은 안 그림)

      // 머리·쉼표·덧줄·점·음이름
      ev.forEach(e=>{
        const ng=el('g',{},g); e.ref=ng; noteEls.push(e);
        if(e.chordOnly) return;
        if(e.rest){ drawRest(ng,e,y0); return; }
        const hollow=e.dur>=8, w=e.dur===16?S*0.95:S*0.72;           // 리듬 슬래시 머리
        el('path',{class:hollow?'nh hollow':'nh',d:`M${e.x-w} ${e.y+S*0.95} L${e.x-w+S*0.52} ${e.y+S*0.95} L${e.x+w} ${e.y-S*0.95} L${e.x+w-S*0.52} ${e.y-S*0.95}Z`,
          fill:hollow?'none':'currentColor',stroke:'currentColor','stroke-width':hollow?S*0.15:0.6,'stroke-linejoin':'round'},ng);
        if(e.dur===16) e.up=true;
        if(e.sign){
          const fs=S*2.6, half=e.dur===16?S*0.85:S*0.6;
          const xmax={'♯':275,'♭':249,'♮':226}[e.sign]*fs/1000, off={'♯':0.42,'♭':0.3,'♮':0.42}[e.sign]*S;
          el('text',{x:e.x-half-S*0.35-xmax,y:e.y+off,'font-size':fs,'font-family':'Noto Music, serif',fill:'currentColor'},ng,e.sign);
        }
        if(e.dur===3||e.dur===6||e.dur===12){
          const onLine=((e.deg%2)+2)%2===0;
          el('circle',{class:'nh',cx:e.x+S*1.1,cy:e.y-(onLine?S/2:0),r:S*0.19,fill:'currentColor'},ng);
        }
      });

      // 기둥·꼬리·빔 (박 단위로 묶기)
      const groups=[]; let gc=[];
      ev.forEach(e=>{
        if(e.chordOnly) return;
        const beamable=!e.rest&&e.dur<4;
        if(!beamable){ if(gc.length) groups.push(gc); gc=[]; if(!e.rest&&e.dur!==16) groups.push([e]); return; }
        const bi=Math.floor(e.pos/M.beat);
        if(gc.length&&gc[0].bi!==bi){ groups.push(gc); gc=[]; }
        e.bi=bi; gc.push(e);
      });
      if(gc.length) groups.push(gc);
      groups.forEach(gr=>gr.length===1?drawSingle(gr[0],mid):drawBeam(g,gr,mid));
      mx=bx;
    });
    el('text',{x:x0,y:y0-12,'font-size':S*1.1,style:'fill:var(--muted)','font-family':'IBM Plex Sans KR, sans-serif'},g,String(ms[0]+1));
  });

  // 붙임줄 (줄이 바뀌면 둘로 나눠 그림)
  const tg=el('g',{},svg), flat=song.measures.flat();
  flat.forEach((e,i)=>{
    if(!e.tieNext) return;
    const n=flat[i+1], dir=e.up?1:-1;
    if(e.sys===n.sys) tieArc(tg,e.x+S*0.8,n.x-S*0.8,e.y,dir);
    else { tieArc(tg,e.x+S*0.8,sysInfo[e.sys].end-3,e.y,dir); tieArc(tg,sysInfo[n.sys].start-S*0.3,n.x-S*0.8,n.y,dir); }
  });

  // 코드 이름(위) · 도수와 구성음(아래)
  song.segs.forEach(sg=>{
    const e=sg.ev, inf=sysInfo[e.sys], g=el('g',{class:'chord'},svg); sg.ref=g;
    const x=e.x;
    const t=el('text',{x,y:inf.y0-S*2.3,'font-size':S*(narrow?1.75:1.95),'font-weight':700,'font-family':'IBM Plex Sans KR, sans-serif',fill:'currentColor'},g);
    let lift=0, prevFlat=false;                                     // ♯·♭은 글자 높이에 맞게 조금 올림 (다음 글자는 원래 줄로)
    chordParts(sg.chord,key).forEach(([txt,kind])=>{
      const up=kind==='acc'?(txt.includes('♯')?S*0.42:S*0.12):kind==='tacc'?(txt.includes('♯')?S*0.3:S*0.08):0, a=kind==='acc'?{'font-family':'Noto Music, serif','font-size':S*1.55}:kind==='tacc'?{'font-family':'Noto Music, serif','font-size':S*(narrow?1.05:1.15)}:kind==='q'?{'font-size':S*(narrow?1.3:1.45)}:{};
      if(up!==lift){ a.dy=lift-up; lift=up; }
      if(prevFlat) a.dx=-S*0.3;                                     // 괄호 안 ♭ 앞뒤 빈칸 줄이기
      if(kind==='tacc'&&txt==='♭') a.dx=-S*0.2;
      prevFlat=kind==='tacc'&&txt==='♭';
      el('tspan',a,t,txt); });
    let y=inf.y0+4*S+S*3.4;
    if(showDeg){ el('text',{x,y,'font-size':S*1.35,'font-weight':700,'font-family':'IBM Plex Sans KR, sans-serif',style:'fill:var(--muted)'},g,romanOf(sg.chord)); y+=S*2.2; }
    if(showTones){ const tn=toneNames(sg.chord,key);                  // 구성음: 근음부터 가로 한 줄
      el('text',{x,y,'font-size':S*1.18,'font-weight':500,'font-family':'IBM Plex Sans KR, sans-serif',style:'fill:var(--muted)','word-spacing':S*0.15},g,tn.join(' ')); }   // 근음부터 가로로
  });
}
function drawSingle(e,mid){
  const up=true; e.up=up;                                  // 슬래시는 기둥이 늘 위로
  const flags=e.dur===1?2:(e.dur===2||e.dur===3)?1:0;
  const len=S*(flags===2?3.9:3.4);
  const sx=up?e.x+S*0.55:e.x-S*0.55;
  const tip=up?Math.min(e.y-len,mid):Math.max(e.y+len,mid);
  el('line',{class:'st',x1:sx,x2:sx,y1:e.y,y2:tip,stroke:'currentColor','stroke-width':1.3},e.ref);
  for(let k=0;k<flags;k++){
    const ty=tip+(up?1:-1)*k*S*0.85;
    const d=up?`M${sx} ${ty} c0 ${S*0.9} ${S*1.1} ${S*1.2} ${S*0.9} ${S*2.6} c${S*0.1} ${-S*1} ${-S*0.4} ${-S*1.5} ${-S*0.9} ${-S*1.8}z`
              :`M${sx} ${ty} c0 ${-S*0.9} ${S*1.1} ${-S*1.2} ${S*0.9} ${-S*2.6} c${S*0.1} ${S*1} ${-S*0.4} ${S*1.5} ${-S*0.9} ${S*1.8}z`;
    el('path',{class:'st',d,fill:'currentColor'},e.ref);
  }
}
function drawBeam(g,gr,mid){
  const up=true;
  const L=S*(gr.some(e=>e.dur===1)?3.5:3.2), dh=up?S*0.48:-S*0.48;
  gr.forEach(e=>{ e.up=up; e.sx=up?e.x+S*0.55:e.x-S*0.55; });
  const a=gr[0], z=gr[gr.length-1];
  let slope=(z.y-a.y)/Math.max(1,z.sx-a.sx)*0.5; slope=Math.max(-0.12,Math.min(0.12,slope));
  let b=up?Math.min(...gr.map(e=>e.y-L-slope*(e.sx-a.sx))):Math.max(...gr.map(e=>e.y+L-slope*(e.sx-a.sx)));
  const by=x=>b+slope*(x-a.sx);
  const ex=Math.max(...gr.map(e=>up?by(e.sx)-mid:mid-by(e.sx)));   // 기둥은 가운데 줄까지는 닿게
  if(ex>0) b+=up?-ex:ex;
  gr.forEach(e=>el('line',{class:'st',x1:e.sx,x2:e.sx,y1:e.y,y2:by(e.sx),stroke:'currentColor','stroke-width':1.3},e.ref));
  const bar=(xa,xb,off)=>el('path',{d:`M${xa} ${by(xa)+off} L${xb} ${by(xb)+off} L${xb} ${by(xb)+off+dh} L${xa} ${by(xa)+off+dh}Z`,fill:'currentColor'},g);
  bar(a.sx-0.65,z.sx+0.65,0);
  const off=up?S*0.8:-S*0.8;                                      // 16분음표 둘째 빔
  for(let i=0;i<gr.length;){
    if(gr[i].dur!==1){ i++; continue; }
    let j=i; while(j+1<gr.length&&gr[j+1].dur===1) j++;
    if(j>i) bar(gr[i].sx-0.65,gr[j].sx+0.65,off);
    else if(i===0) bar(gr[i].sx-0.65,gr[i].sx+S*1.1,off);
    else bar(gr[i].sx-S*1.1,gr[i].sx+0.65,off);
    i=j+1;
  }
}
function drawRest(g,e,y0){
  const x=e.x, d=e.dur, base=y0+4*S;
  if(d===16){ el('rect',{class:'nh',x:x-S*0.65,y:y0+S,width:S*1.3,height:S*0.5,fill:'currentColor'},g); return; }
  if(d===8){ el('rect',{class:'nh',x:x-S*0.65,y:y0+S*1.5,width:S*1.3,height:S*0.5,fill:'currentColor'},g); return; }
  if(d===4||d===6){
    glyph(g,'r4',x,base);
    if(d===6) el('circle',{class:'nh',cx:x+S*1.0,cy:y0+S*1.5,r:S*0.19,fill:'currentColor'},g);
    return;
  }
  if(d===2){ glyph(g,'r2',x,base); return; }
  glyph(g,'r1',x,base);
}
function tieArc(g,xa,xb,y,dir){
  if(xb-xa<S*0.6) xb=xa+S*0.6;
  const yy=y+dir*S*0.62, xm=(xa+xb)/2, h=Math.min(S*1.05,S*0.45+(xb-xa)*0.12);
  el('path',{d:`M${xa} ${yy} Q${xm} ${yy+dir*h} ${xb} ${yy} Q${xm} ${yy+dir*(h-S*0.3)} ${xa} ${yy}Z`,fill:'currentColor'},g);
}

/* ---------- 소리 (그랜드 피아노 녹음) ---------- */
let ctx=null, master=null, buffers=null, loading=null, playing=false, timers=[], nodes=[];
function makeCtx(){
  if(ctx) return ctx;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-10; comp.ratio.value=4;
  master=ctx.createGain(); master.gain.value=1; master.connect(comp); comp.connect(ctx.destination);
  return ctx;
}
function audio(){ const c=makeCtx(); if(c.state==='suspended') c.resume(); return c }
function loadPiano(){
  if(loading) return loading;
  let c; try{ c=makeCtx() }catch(e){ return Promise.resolve(null) }
  loading=Promise.all(Object.keys(PIANO).map(m=>{
    const bin=atob(PIANO[m]), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return new Promise((res,rej)=>c.decodeAudioData(bytes.buffer,res,rej)).then(buf=>[+m,buf]);
  })).then(list=>(buffers=list)).catch(()=>(buffers=null));
  return loading;
}
function tone(midi,t,len,vol=1){
  const c=audio();
  if(!buffers) return synthTone(midi,t,len,vol);
  let best=buffers[0];
  for(const b of buffers) if(Math.abs(b[0]-midi)<Math.abs(best[0]-midi)) best=b;
  const src=c.createBufferSource(), g=c.createGain();
  src.buffer=best[1]; src.playbackRate.value=Math.pow(2,(midi-best[0])/12);
  const v=1.5*vol, end=t+Math.max(len,0.12);
  g.gain.setValueAtTime(v,t); g.gain.setValueAtTime(v,end); g.gain.setTargetAtTime(0,end,0.07);   // 건반에서 손을 떼는 느낌
  src.connect(g); g.connect(master); src.start(t); src.stop(end+0.6); nodes.push(src);
}
function synthTone(midi,t,len,vol){      // 피아노 소리를 못 불러왔을 때만 쓰는 대체음
  const c=audio(), f=440*Math.pow(2,(midi-69)/12), g=c.createGain(); g.connect(master);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3*vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(len,0.15)+0.25);
  const o=c.createOscillator(); o.type='triangle'; o.frequency.value=f; o.connect(g); o.start(t); o.stop(t+len+0.6); nodes.push(o);
}
function click(t,lv){
  const c=audio(), o=c.createOscillator(), g=c.createGain();
  o.frequency.value=lv===2?1600:lv===1?1300:1100; o.type='square';
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(lv===2?0.16:lv===1?0.12:0.08,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.06); nodes.push(o);
}
async function ready(){
  if(buffers) return;
  $('status').textContent='피아노 소리를 준비하는 중…';
  await loadPiano();
  $('status').textContent='';
}
function stop(){
  playing=false; timers.forEach(clearTimeout); timers=[];
  nodes.forEach(o=>{try{o.stop()}catch(e){}}); nodes=[];
  noteEls.forEach(n=>n.ref&&n.ref.classList.remove('on'));
  if(song&&song.segs) song.segs.forEach(s=>s.ref&&s.ref.classList.remove('on'));
  $('playTxt').textContent='정답 듣기'; $('playIcon').innerHTML='<path d="M4 2l10 6-10 6z"/>'; $('status').textContent='';
}
async function play(){
  if(playing){stop();return}
  audio(); playing=true;
  $('playTxt').textContent='멈춤'; $('playIcon').innerHTML='<path d="M3 2h4v12H3zM9 2h4v12H9z"/>';
  await ready(); if(!playing) return;
  if(!song.counted){ song.counted=true; const d=done[mode]||(done[mode]={}); d[sel===0?'R':level]=(d[sel===0?'R':level]||0)+1; store.set('done2',done); syncCards(); }
  const c=audio(), M=song.M;
  const u=60/tempo/4, ci=M.click*u, nClick=M.len/M.click;   // u = 16분음표 길이(초)
  let t=c.currentTime+0.15;
  if($('countin').checked){
    for(let b=0;b<nClick;b++){ click(t+b*ci,M.accent[b]); timers.push(setTimeout(()=>$('status').textContent=`${b===0?'준비… ':''}${b+1}`,(t+b*ci-c.currentTime)*1000)); }
    t+=nClick*ci;
  }
  const startT=t;
  timers.push(setTimeout(()=>$('status').textContent='',(startT-c.currentTime)*1000));
  const flat=song.measures.flat();
  flat.forEach((n,i)=>{
    const len=n.dur*u;
    if(!n.rest&&!n.tiedFrom){
      let total=len, j=i;
      while(flat[j].tieNext){ j++; total+=flat[j].dur*u; }       // 붙임줄은 이어서 한 번만 소리
      strike(n.chord,t,total*0.95);
    }
    n.t=t;
    const on=(t-c.currentTime)*1000, off=on+len*1000;
    timers.push(setTimeout(()=>n.ref.classList.add('on'),on));
    timers.push(setTimeout(()=>n.ref.classList.remove('on'),off-15));
    t+=len;
  });
  song.segs.forEach((sg,i)=>{                                      // 지금 치는 코드 이름 강조
    const a=sg.ev.t, z=i+1<song.segs.length?song.segs[i+1].ev.t:t;
    timers.push(setTimeout(()=>sg.ref.classList.add('on'),(a-c.currentTime)*1000));
    timers.push(setTimeout(()=>sg.ref.classList.remove('on'),(z-c.currentTime)*1000-15));
  });
  if($('metro').checked){ const total=bars*nClick; for(let b=0;b<total;b++) click(startT+b*ci,M.accent[b%nClick]); }
  timers.push(setTimeout(stop,(t-c.currentTime)*1000+300));
}
async function playRef(){
  if(playing) stop();
  audio(); await ready();
  const c=audio(), t=c.currentTime+0.1;
  const I=song.tonicChord, v=voicing(I,song.key);
  tone(v.bass,t,2.6,0.7); v.upper.forEach((m,i)=>tone(m,t+i*0.28,2.4-i*0.28,0.55));
  strike(I,t+1.3,1.4);
  $('status').textContent=`${song.key.label} 키 으뜸화음 (${chordName(I,song.key)})`;
  timers.push(setTimeout(()=>{ if(!playing) $('status').textContent='' },3400));
}

/* ---------- 화면 ---------- */
function updateMeta(){
  const kn=Object.keys(song.key.acc).length, ksh=kn&&song.key.acc[Object.keys(song.key.acc)[0]]>0;
  $('meta').innerHTML=`<span>키 <b>${song.key.label}</b>${kn?' ('+(ksh?'♯':'♭')+kn+')':''}</span><span>박자 <b>${meter}</b></span><span>단계 <b>${sel===0?'랜덤':level}</b></span><span>모드 <b>${mode==='hard'?'Hard':'Easy'}</b></span>`;
}
function fresh(){ stop(); if(sel===0) level=LEVELS.length; song=makeSong(); updateMeta(); render(); updDesc(); }
const STAR3=LEVELS.map(()=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.6.7-5 4.5 1.4 6.6L12 17.3 6.1 20.5l1.4-6.6-5-4.5 6.6-.7z"/></svg>').join('');
function updDesc(){ const L=LEVELS[level-1]; $('lvdesc').textContent=(sel===0?'1~'+LEVELS.length+'단계 코드가 한 곡에 섞여 나와요':L.chords)+(mode==='hard'?' · 부속화음·차용화음 추가':''); }
function levelInfo(n){
  const c=(done[mode]||{})[n===0?'R':n]||0;                 // 막대: 연습한 곡 수 (20곡이면 가득)
  return {c,pct:Math.min(100,Math.round(c/20*100))};
}
function buildCards(){
  const box=$('levels');
  LEVELS.forEach(L=>{
    const b=document.createElement('button'); b.type='button'; b.className='stage'; b.dataset.v=L.n;
    b.innerHTML='<span class="top"><span class="num">'+L.n+'</span><span class="hardtag" aria-hidden="true"><span class="full">+ 부속·차용</span><span class="short">+α</span></span></span><span class="sym" aria-hidden="true"></span><span class="name"></span><span class="stars" aria-hidden="true">'+STAR3+'</span><span class="prog"><span class="pbar"><i></i></span><span class="cnt"></span></span>';
    box.appendChild(b);
  });
  const r=box.lastElementChild.cloneNode(true); r.dataset.v=0; r.classList.add('rnd'); r.querySelector('.num').textContent='R'; box.appendChild(r);   // 랜덤 단계 카드
}
function syncCards(){
  $('levels').querySelectorAll('.stage').forEach(b=>{
    const n=+b.dataset.v, inf=levelInfo(n), Lv=n?LEVELS[n-1]:{sym:'1~'+LEVELS.length}, name=n?Lv.name:'랜덤';
    b.setAttribute('aria-pressed',n===sel);
    b.querySelector('.sym').textContent=Lv.sym;
    b.querySelector('.name').textContent=name;
    b.querySelectorAll('.stars svg').forEach((s,k)=>s.classList.toggle('on',k<n));      // 별 = 난이도
    b.querySelector('.cnt').textContent=inf.c+'곡';
    b.querySelector('.pbar i').style.width=inf.pct+'%';
    b.setAttribute('aria-label',(n?n+'단계 ':'')+name+(mode==='hard'?' + 부속·차용 코드':'')+', 난이도 별 '+n+'개, '+inf.c+'곡 연습');
  });
}
function segButtons(id,items,label){
  const box=$(id);
  items.forEach(v=>{ const b=document.createElement('button'); b.type='button'; b.dataset.v=v; b.textContent=label(v); box.appendChild(b); });
}
function buildUI(){
  buildCards();
  segButtons('modes',['easy','hard'],v=>v==='easy'?'Easy':'Hard');
  segButtons('meters',METER_ORDER,v=>v);
  KEY_GROUPS.forEach((g,i)=>{ const box=document.createElement('div'); box.className='seg'+(i?' krow':' kc'); box.id='keys'+i; (i?$('keys').querySelector('.krows'):$('keys')).insertAdjacentElement(i?'beforeend':'afterbegin',box); segButtons('keys'+i,g,v=>KEYS[v].label); });
  $('keys').querySelectorAll('button').forEach(b=>{                 // 글자 아래에 조표 개수
    const k=KEYS[b.dataset.v], n=Object.keys(k.acc).length, sh=n&&k.acc[Object.keys(k.acc)[0]]>0;
    const sub=n?(sh?'♯':'♭')+n:'없음';
    b.innerHTML='<span class="kl">'+k.label+'</span><span class="ks">'+sub+'</span>';
    b.setAttribute('aria-label',k.label+' 키, '+(n?(sh?'샵 ':'플랫 ')+n+'개':'조표 없음'));
  });
  const sync=()=>{
    document.body.classList.toggle('hard',mode==='hard');
    syncCards();
    $('modes').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===mode));
    $('meters').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===meter));
    $('keys').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===keyName));
    $('bars').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===bars));
    updDesc();
  };
  const on=(id,fn)=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fn(b.dataset.v);sync();fresh();});
  on('levels',v=>{sel=+v; if(sel) level=sel; store.set('level',sel)});
  on('modes',v=>{mode=v;store.set('mode',mode)});
  on('meters',v=>{meter=v;store.set('meter',meter)});
  on('keys',v=>{keyName=v;store.set('key',keyName)});
  on('bars',v=>{bars=+v;store.set('bars',bars)});
  $('tempo').value=tempo; $('tempoOut').textContent='♩ = '+tempo;
  $('tempo').addEventListener('input',e=>{tempo=+e.target.value;$('tempoOut').textContent='♩ = '+tempo});
  $('deg').checked=showDeg; $('tones').checked=showTones;
  $('deg').addEventListener('change',e=>{showDeg=e.target.checked;store.set('deg',showDeg);stop();render()});
  $('tones').addEventListener('change',e=>{showTones=e.target.checked;store.set('tones',showTones);stop();render()});
  $('newBtn').onclick=fresh; $('playBtn').onclick=play; $('refBtn').onclick=playRef;
  // 연습 기록 초기화: 한 번 더 물어본 뒤 Easy·Hard 모든 단계의 곡 수를 0으로
  let resetT;
  const showReset=(ask,msg)=>{ $('resetBtn').hidden=ask; $('resetAsk').hidden=!ask; $('resetMsg').hidden=!msg; };
  $('resetBtn').onclick=()=>{ clearTimeout(resetT); showReset(true,false); $('resetNo').focus(); };
  $('resetNo').onclick=()=>{ showReset(false,false); $('resetBtn').focus(); };
  $('resetYes').onclick=()=>{
    done={easy:{},hard:{}}; store.set('done2',done); try{ localStorage.removeItem('sr-done'); }catch(e){}
    syncCards(); showReset(false,true); $('resetBtn').focus();
    resetT=setTimeout(()=>{ $('resetMsg').hidden=true; },2500);
  };
  $('resetAsk').addEventListener('keydown',e=>{ if(e.key==='Escape') $('resetNo').click(); });
  let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{stop();render()},150)});
  sync();
}
buildUI(); fresh();
try{ loadPiano() }catch(e){}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(render);
})();

</script>
