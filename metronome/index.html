<style>body{margin:0}[hidden]{display:none!important}

/* 레이아웃: 머리 띠 → 연습 설정판(단계 카드·모드·박자·키) → 흰 악보 → 재생 버튼 */
:root{
  --bg:#FFFFFF; --ink:#18202E; --muted:#5B6372; --line:#DCE1E8; --tile:#F3F5F8;
  --accent:#2B55C9; --accent-soft:#E9EEFB; --accent-shadow:rgba(43,85,201,.25); --accent-glow:rgba(43,85,201,.16);
  --hard:#E8461F; --hard-soft:#FFD2C6; --hard-bg:#FFF1EC; --star:#FFB400; --star-off:#DDE2EA;
  --f-body:'IBM Plex Sans KR',system-ui,sans-serif;
  --f-disp:'Black Han Sans','IBM Plex Sans KR',sans-serif;
  --f-music:'Noto Music','Bravura',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55}
button{font:inherit;cursor:pointer}
.band{border-bottom:1.5px solid var(--line);background:linear-gradient(180deg,var(--accent-soft),var(--bg))}
.band .in{max-width:1080px;margin:0 auto;padding-block:26px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:16px}
.mark{width:56px;height:56px;border-radius:16px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark span{font-family:var(--f-music);font-size:40px;line-height:1;color:#fff;margin-top:6px}
.mark svg{width:48px;height:48px;fill:#fff} .mark svg .h{fill:var(--accent)}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance}
h1.logo{font-family:var(--f-disp);font-weight:400;font-size:36px;letter-spacing:.01em;line-height:1.1} h1.logo img{display:block;height:92px;width:auto;margin:-6px 0 -6px -5px}
.how{margin:4px 0 0;color:var(--muted);font-size:17px}
.wrap{max-width:1080px;margin:0 auto;padding-block:22px 44px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

.panel{display:flex;flex-direction:column;gap:14px;padding:18px 20px;border-radius:18px;background:var(--tile)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 32px}
.field{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.label{font-size:15px;font-weight:700;color:var(--muted);min-width:44px}

/* 단계 카드 */
.stagewrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:stretch}
#levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stage{position:relative;text-align:left;border:2px solid var(--line);border-radius:18px;padding:14px 14px 12px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;gap:4px;min-width:0}
.stage .num{font-family:var(--f-disp);font-size:36px;line-height:1}
.stage .sym{position:absolute;right:12px;top:10px;font-family:var(--f-music);font-size:32px;line-height:1;color:#B7BFCD}
.stage .name{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stars{display:flex;gap:2px} .stars svg{width:18px;height:18px;fill:var(--star-off)} .stars svg.on{fill:var(--star)}
.cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden} .pbar i{display:block;height:100%;width:0;background:var(--accent)}
.stage[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 8px 20px var(--accent-glow)}
.stage[aria-pressed="true"] .num,.stage[aria-pressed="true"] .sym{color:var(--accent)}
.hardtag{display:none;align-self:flex-start;padding:2px 9px;border-radius:999px;background:var(--hard-bg);color:var(--hard);font-size:13.5px;font-weight:700;line-height:1.5}
.hardtag .short{display:none}
.hard .hardtag{display:inline-flex}
.hard .wrap{--accent:var(--hard);--accent-soft:var(--hard-bg);--accent-shadow:rgba(232,70,31,.28);--accent-glow:rgba(232,70,31,.16)}
/* 모드: 단계 카드와 같은 테두리 카드 안에 Easy/Hard를 하나의 이어 붙인 버튼으로 */
.modebox{display:flex;flex-direction:column;gap:8px;padding:12px 12px 12px;border:2px solid var(--line);border-radius:18px;background:var(--bg)}
.modebox .label{min-width:0}
#modes{display:flex;flex-direction:column;flex:1;min-width:112px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
#modes button{flex:1;min-height:46px;padding:0 16px;border:0;border-bottom:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:18px;color:var(--muted)}
#modes button:last-child{border-bottom:0}
#modes button[aria-pressed="true"][data-v="easy"]{background:var(--accent);color:var(--bg)}
#modes button[aria-pressed="true"][data-v="hard"]{background:var(--hard);color:var(--bg)}
.lvdesc{font-size:16px;color:var(--muted);margin-top:-4px}

/* 이어 붙인 버튼 묶음 */
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.seg button{min-height:46px;padding:8px 16px;border:0;border-right:1.5px solid var(--line);background:var(--bg);font-size:17px;font-weight:500;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:700}
#keys button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:56px;padding:6px 13px;line-height:1.15}
#keys .kl{font-size:18px;font-weight:700}
#keys .ks{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
#keys button[aria-pressed="true"] .ks{color:var(--bg)}
.tempo{display:flex;align-items:center;gap:12px}
.tempo input{width:170px;accent-color:var(--accent)}
.tempo output{font-weight:700;font-variant-numeric:tabular-nums;min-width:72px}
.checks{display:flex;gap:22px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;font-size:17px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 악보 */
.sheet{background:var(--bg);border:1.5px solid var(--line);border-radius:18px;padding:20px 14px 14px;box-shadow:0 10px 30px rgba(24,32,46,.07);overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 10px 6px;font-size:16px;color:var(--muted)}
.meta b{color:var(--ink)}
#score{display:block;width:100%;height:auto;color:var(--ink)}
#score .on .nh,#score .on .st{fill:var(--accent);stroke:var(--accent)}
#score .on text{fill:var(--accent)}
#score .on .hollow{fill:none}

.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:58px;padding:0 24px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;color:var(--ink)}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);box-shadow:0 8px 18px var(--accent-shadow)}
.btn.new{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.status{font-size:16px;color:var(--muted);min-height:1.5em}
.credit{margin:8px 0 0;font-size:14px;color:var(--muted)}

/* 광고 자리: 컴퓨터는 양옆 세로(160×600), 휴대폰·태블릿은 버튼 아래 가로(320×100). ads-off면 숨김 */
.layout{max-width:1448px;margin:0 auto}
.wrap{container-type:inline-size}
.ad{display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--line);border-radius:12px;background:var(--tile);color:var(--muted);font-size:15px;font-weight:700}
.ad small{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.ad-side{width:160px;height:600px}
.ad-bottom{width:100%;max-width:320px;height:100px;margin:0 auto}
@media (min-width:1024px){
  body:not(.ads-off) .layout{display:grid;grid-template-columns:160px minmax(0,1fr) 160px;gap:24px;align-items:start;
    padding-block:22px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body:not(.ads-off) .layout .wrap{max-width:none;margin:0;width:auto;padding-left:0;padding-right:0;padding-top:0}
  body:not(.ads-off) .ad-side{display:flex}
  body:not(.ads-off) .band .in{max-width:1448px;padding-left:calc(max(16px,env(safe-area-inset-left,0px)) + 184px);padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + 184px)}
}
@media (max-width:1023.98px){ body:not(.ads-off) .ad-bottom{display:flex} }
@container (max-width:760px){
  .stagewrap{grid-template-columns:1fr}
  .modebox{flex-direction:row;align-items:center;gap:12px;padding:8px 12px;border-radius:14px} #modes{flex-direction:row;flex:1} #modes button{flex:1;min-width:0;border-bottom:0;border-right:1.5px solid var(--line)} #modes button:last-child{border-right:0}
}

@media (max-width:720px){
  .band .in{padding-block:18px 16px} h1{font-size:25px} h1.logo img{height:72px} .mark{width:46px;height:46px} .mark span{font-size:33px} .mark svg{width:40px;height:40px}
  .panel{padding:14px 12px}
  .stagewrap{grid-template-columns:1fr}
  #levels{gap:6px}
  .stage{padding:10px 4px 8px;border-radius:14px;align-items:center;text-align:center}
  .stage .num{font-size:28px} .stage .sym{position:static;font-size:24px;height:26px} .stage .name{display:none}
  .stage .foot{flex-direction:column;gap:2px} .stars svg{width:13px;height:13px} .cnt{font-size:13px}
  .pbar{width:80%}
  .hardtag{align-self:center;padding:1px 7px;font-size:12px} .hardtag .full{display:none} .hardtag .short{display:inline}
  .modebox{flex-direction:row;align-items:center;gap:12px;padding:8px 12px;border-radius:14px} #modes{flex-direction:row;flex:1} #modes button{flex:1;min-width:0;border-bottom:0;border-right:1.5px solid var(--line)} #modes button:last-child{border-right:0}
  .seg button{padding:8px 12px}
  #keys button{padding:6px 6px;min-width:36px}
  .tempo input{width:140px}
  .btn{flex:1 1 46%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

/* 맨 위 메뉴 (세 페이지 공통) */
.band .in{flex-wrap:wrap;row-gap:14px}
.brand{display:flex;align-items:center;gap:16px;color:inherit;text-decoration:none;margin-right:auto;min-width:0}
.nav{display:flex;gap:4px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:4px}
.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:10px;font-weight:700;font-size:17px;color:var(--muted);text-decoration:none;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav a:focus-visible,.brand:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:720px){ .nav{width:100%;box-sizing:border-box;gap:2px} .nav a{flex:1 1 0;min-width:0;padding:4px 2px;font-size:15px;line-height:1.2;white-space:normal;text-align:center;word-break:keep-all} }   /* 메뉴 5칸: 휴대폰은 두 줄 글씨 허용 */

/* 메트로놈 */
.metro{background:var(--bg);border:1.5px solid var(--line);border-radius:22px;padding:28px 24px 26px;box-shadow:0 10px 30px rgba(24,32,46,.07);max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:18px}
.term{display:flex;flex-direction:column;align-items:center;gap:2px}
.term b{font-size:24px;font-weight:700;font-style:italic;color:var(--accent)}
.term span{font-size:16px;color:var(--muted)}
/* 빠르기 다이얼 (K 요청 2026-11-25, pure:smooth 다이얼 참고): 30~250을 270° 호로, 파란 호 = 지금 빠르기. 호를 끌어서 바꿀 수 있음 */
.dial{position:relative;width:min(340px,78vw);aspect-ratio:1;display:grid;place-items:center}
.dial>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;overflow:visible}
.dial .track,.dial .val{fill:none;stroke-width:6;stroke-linecap:round}
.dial .track{stroke:var(--line);stroke-dasharray:640.88 854.51}
.dial .val{stroke:var(--accent)}
.dial .ticks line{stroke:var(--line);stroke-width:1.5;stroke-linecap:round}
.dial .ticks line.on{stroke:var(--accent);opacity:.55}
.dial .disk{fill:var(--tile)}
.dial .rim{fill:none;stroke:var(--line);stroke-width:1.5}
.dial .water{transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.dial .wv path{fill:var(--accent)}
.dial .wv.back path{opacity:.14;animation:wave 6s linear infinite reverse}
.dial .wv.front path{opacity:.24;animation:wave 4s linear infinite}
.dial .wv.back{transform:translateY(-5px)}
@keyframes wave{from{transform:translateX(-150px)}to{transform:translateX(0)}}
.dial .knob{fill:var(--bg);stroke:var(--accent);stroke-width:4;filter:drop-shadow(0 2px 4px var(--accent-shadow))}
@media (prefers-reduced-motion:reduce){ .dial .wv path{animation:none} }
.dial .round{position:absolute;bottom:-3%;width:48px;height:48px;font-size:26px;z-index:1;border:0;background:var(--tile);color:var(--ink)} #minus{left:7%} #plus{right:7%}
.dial .bpmbox{position:relative;pointer-events:none;margin-top:6px}
.bpmbox{display:flex;flex-direction:column;align-items:center}
#bpm{font-family:var(--f-disp);font-size:clamp(84px,22vw,118px);line-height:.95;color:var(--ink);font-variant-numeric:tabular-nums}
#bpm.pulse{animation:pulse .18s ease-out}
@keyframes pulse{0%{transform:scale(1.04)}100%{transform:scale(1)}}
.unit{margin-top:10px;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.slide{display:flex;align-items:center;gap:14px;width:100%;max-width:520px}
.slide input{flex:1;min-width:0;accent-color:var(--accent);height:30px}
.round{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:30px;line-height:1;color:var(--ink);display:grid;place-items:center;flex:none}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.presets button{min-width:66px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.presets button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.beats{display:flex;gap:16px;justify-content:center;align-items:center;min-height:40px}
.beats i{width:22px;height:22px;border-radius:50%;background:var(--line);transition:transform .08s}
.beats i.first{width:30px;height:30px;background:rgba(232,70,31,.3)}   /* 강박: 크고 주황빛 */
.beats .bt{border:0;background:transparent;padding:7px;margin:-7px;display:grid;place-items:center;border-radius:50%;cursor:pointer}
.beatbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.beathint{font-size:15px;color:var(--muted)}

.beats i.mid{width:26px;height:26px}
.beats i.on{background:var(--accent);transform:scale(1.15)}
.beats i.first.on{background:var(--hard)}
.beats .bg{display:flex;align-items:center;gap:7px}                 /* 큰 박 + 나눈 박(작은 점) 묶음 */
.beats i.sub{width:12px;height:12px}
@media (max-width:720px){ .beats.dense{gap:10px} .beats.dense .bg{gap:5px} .beats.dense i{width:16px;height:16px} .beats.dense i.first{width:22px;height:22px} .beats.dense i.mid{width:19px;height:19px} .beats.dense i.sub{width:9px;height:9px} }
.ctrl{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:18px;width:100%;max-width:520px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;color:var(--ink);font-weight:700;font-size:16px;cursor:pointer}
.side .ic{width:58px;height:58px;border-radius:50%;background:var(--tile);border:1.5px solid var(--line);display:grid;place-items:center}
.side svg{width:28px;height:28px;fill:var(--ink)}
#tap.hit .ic{background:var(--accent-soft);border-color:var(--accent)}
.sw input{appearance:none;-webkit-appearance:none;width:58px;height:34px;border-radius:17px;background:var(--line);position:relative;margin:12px 0;cursor:pointer}
.sw input::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(24,32,46,.3);transition:left .15s}
.sw input:checked{background:var(--accent)} .sw input:checked::after{left:28px}
.bigplay{width:100px;height:100px;border-radius:50%;border:0;background:var(--accent);display:grid;place-items:center;box-shadow:0 12px 26px var(--accent-shadow)}
.bigplay svg{width:38px;height:38px;fill:var(--bg)}
.meterrow{display:flex;align-items:center;gap:12px}
.meterrow .label{min-width:2.6em;text-align:right}
.seg button:disabled{color:var(--line);cursor:default}
#sounds button{padding:8px 13px}
.sndrow{margin-top:18px}   /* 탭·재생과 소리 줄 사이를 띄움 (K 요청 2026-11-12 "소리부터 좀 내리면") */

#subs button{display:inline-flex;align-items:center;justify-content:center;min-width:66px;padding:6px 14px}
#subs .nt{height:30px;width:auto;fill:currentColor;display:block} #subs .nt3{height:36px}
@media (max-width:720px){ .metro{padding:22px 14px;gap:16px} .round{width:48px;height:48px} .bigplay{width:88px;height:88px} .presets button{min-width:56px} }
@media (prefers-reduced-motion:reduce){ #bpm.pulse{animation:none} }

/* 아래 조작부 다듬기 (K 요청 2026-11-25 "세련되게") — 메트로놈 상자 안에서만 */
.metro{gap:22px}
.metro .presets{gap:6px;padding:5px;border-radius:16px;background:var(--tile)}
.metro .presets button{min-width:62px;min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted)}
.metro .presets button[aria-pressed="true"]{background:var(--bg);color:var(--accent);box-shadow:0 2px 8px rgba(24,32,46,.10)}
.metro .beats i{background:var(--tile);box-shadow:inset 0 0 0 1.5px var(--line)}
.metro .beats i.first{background:rgba(232,70,31,.16);box-shadow:inset 0 0 0 1.5px rgba(232,70,31,.35)}
.metro .beats i.on{background:var(--accent);box-shadow:0 0 0 5px var(--accent-glow)}

/* 미래지향 (K 요청 2026-11-25 "더 미래지향적이게") — 시안 A 글로우(.v-glow) · 시안 B LED(.v-led) */
.metro{--acc2:#3FB8FF}

.dial .s1{stop-color:var(--accent)} .dial .s2{stop-color:var(--acc2)}

.metro.v-led .dial .led line{stroke:var(--line);stroke-width:5;stroke-linecap:round}

.metro.v-led .dial .led line.hot{stroke:var(--accent);filter:url(#dialGlow)}
/* 아래 조작부: 고른 칸은 파랑 그라데이션 + 빛 */
.metro .presets button[aria-pressed="true"],.metro .seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--acc2));color:#fff;box-shadow:0 4px 14px var(--accent-shadow)}
html[data-theme="dark"] .metro .presets button[aria-pressed="true"],html[data-theme="dark"] .metro .seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--acc2));color:#16181D;box-shadow:0 4px 14px rgba(242,194,48,.25)}
.metro .bigplay{background:linear-gradient(135deg,var(--accent),var(--acc2));box-shadow:0 10px 30px var(--accent-shadow),0 0 0 8px var(--accent-soft),0 0 40px var(--accent-glow)}
.metro .beats i.on{background:linear-gradient(135deg,var(--accent),var(--acc2));box-shadow:0 0 12px var(--accent-shadow),0 0 0 4px var(--accent-glow)}

/* 설정 펼치기 버튼 */

/* 물결 고급화 + 숫자 누르면 시작 (K 2026-11-25) */
.dial{--wv:4s}
.dial .wv path{animation:none;opacity:1}
.dial .wv.l1 path{fill:url(#dialFill);opacity:.35;animation:wave2 calc(var(--wv)*2.2) linear infinite}
.dial .wv.l1{transform:translateY(-10px)}
.dial .wv.l2 path{fill:url(#dialFill);opacity:.5;animation:wave1 calc(var(--wv)*1.5) linear infinite reverse}
.dial .wv.l2{transform:translateY(-4px)}
.dial .wv.l3 path{fill:url(#dialFill2);animation:wave3 var(--wv) linear infinite}

@keyframes wave1{from{transform:translateX(-150px)}to{transform:translateX(0)}}

    box-shadow:0 0 0 1.5px rgba(43,85,201,.22),0 12px 32px rgba(43,85,201,.18),inset 0 1px 0 rgba(255,255,255,.9);
    opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .25s,transform .25s;pointer-events:none}
  html[data-theme="dark"] .metro.hov .dial .bigic{background:rgba(31,35,42,.6);box-shadow:0 0 0 1.5px rgba(242,194,48,.3),0 12px 32px rgba(0,0,0,.35)}
  .metro.hov .dial .bigic svg{width:38%;height:38%;fill:url(#playGrad);margin-left:6%;filter:drop-shadow(0 4px 10px var(--accent-shadow))}
  .metro.hov .dial.run .bigic svg{margin-left:0}

}

/* HUD (K 요청 2026-11-25 레퍼런스 "HUD Elements" 느낌) — .metro.hud (흰 바탕) · .metro.hud.navy (남색 상자) */

/* 공학 계기판 (K 2026-11-25 "HUD 좋은데 사이트와 결이 안 맞아, 결 맞게 공학적으로") — .metro.eng */

.metro.xmas .dial .hat,.metro.xmas .dial .flakes,.metro.xmas .dial .pile{display:inline}
.metro.xmas{--xsky1:#BCD0F0;--xsky2:#DDE8F8}

/* 크리스마스 전체 느낌 (K "전체적으로 크리스마스 느낌나게") — 메트로놈 상자 안만 */
.metro.xmas{--accent:#C62835;--accent-soft:#FBE9EB;--accent-glow:rgba(198,40,53,.16);--accent-shadow:rgba(198,40,53,.30);--xg:#1F8A4C;--xgold:#E0A526;
  background:repeating-linear-gradient(135deg,#C62835 0 12px,#FFFFFF 12px 24px) top/100% 9px no-repeat,
    radial-gradient(circle,rgba(43,85,201,.13) 1.3px,transparent 1.8px) 0 0/38px 38px,
    radial-gradient(circle,rgba(43,85,201,.09) 1px,transparent 1.5px) 19px 19px/38px 38px,var(--bg)}
html[data-theme="dark"] .metro.xmas{--accent:#E5484D;--accent-soft:rgba(229,72,77,.14);--accent-glow:rgba(229,72,77,.2);--accent-shadow:rgba(229,72,77,.3);--xg:#3BB273;

const ACC={};                                    // 박자별 강박 자리 (점을 눌러 바꿈). 2 강박 · 1 중간 · 0 보통
const accOf=()=>ACC[meter]||(ACC[meter]=METERS[meter].acc.slice());
let bpm=60, meter='4/4', running=false, ctx=null, timer=null, nextT=0, beat=0, queue=[], raf=0, lock=null;

function setBpm(v){
  bpm=Math.max(30,Math.min(250,Math.round(v)));
  $('bpm').textContent=bpm; drawDial();
  const t=TERMS.filter(x=>bpm>=x[0]).pop(); $('termIt').textContent=t[1]; $('termKo').textContent=t[2];
  $('presets').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===bpm));
}
function drawBeats(){
  const M=METERS[meter], box=$('beats'), n=subN(); box.innerHTML='';
  box.classList.toggle('dense',M.n*n>12);
  for(let i=0;i<M.n;i++){
    const g=document.createElement('span'); g.className='bg';
    const A=accOf(), bt=document.createElement('button'); bt.type='button'; bt.className='bt'; bt.dataset.i=i;
    bt.setAttribute('aria-label',(i+1)+'박 '+(A[i]===2?'강박':A[i]===1?'중간 강박':'보통')+', 눌러서 바꾸기');
    const d=document.createElement('i'); if(A[i]===2) d.className='first'; else if(A[i]===1) d.className='mid'; bt.appendChild(d); g.appendChild(bt);
    for(let k=1;k<n;k++){ const s=document.createElement('i'); s.className='sub'; g.appendChild(s); }   // 나눈 박: 작은 점
    box.appendChild(g);
  }
  $('unit').textContent='BPM · '+M.note+' 기준';
}
function subN(){ return meter==='6/8'?(sub===4?2:1):sub; }   // 6/8은 8분·16분만
function syncSubs(){
  if(meter==='6/8'&&(sub===1||sub===3)) sub=2;
  $('subs').querySelectorAll('button').forEach(b=>{ const v=+b.dataset.v; b.disabled=meter==='6/8'&&(v===1||v===3); b.setAttribute('aria-pressed',v===sub); });
}
function audio(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }
const SOUNDS=[['wood','우드'],['beep','비프'],['hihat','하이햇'],['bell','벨']];   /* 벨: K 요청 2026-11-25 (크리스마스) */
   // 모두 브라우저에서 합성 (파일 없음)
try{ localStorage.removeItem('mt-sound'); }catch(e){}   /* 들어올 때마다 설정은 처음으로 — 스위치 · 연습 기록만 기억 (K 요청 2026-11-21) */
let sound=(()=>{ try{ const v=localStorage.getItem('mt-sound'); return SOUNDS.some(x=>x[0]===v)?v:'wood'; }catch(e){ return 'wood'; } })();
let noiseBuf=null;
function noise(){ if(!noiseBuf){ noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.3,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } const n=ctx.createBufferSource(); n.buffer=noiseBuf; return n; }
function env(g,t,peak,len){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+len); }
function hit(t,lv){                               // 고른 소리로 한 번 (lv 2 강박 · 1 중간 · 0 보통 · -1 나눈 박)
  if(sound==='wood') return clickAt(t,lv);
  const c=ctx, P={2:1.35,1:1.18,0:1,'-1':0.85}[lv], G={2:0.9,1:0.7,0:0.55,'-1':0.26}[lv], out=c.createGain(); out.connect(c.destination);
  if(sound==='beep'){ const o=c.createOscillator(); o.type='sine'; o.frequency.value=880*P*(lv===2?1.12:1); o.connect(out); env(out,t,G*0.8,lv===-1?0.04:0.08); o.start(t); o.stop(t+0.1); }
  else if(sound==='bell'){                        /* 종소리: 맑은 배음 몇 개 + 썰매 방울 같은 짧은 찰랑임 */
    const f0=(lv===2?1568:lv===1?1397:1319)*(lv===-1?0.94:1), len=lv===-1?0.25:lv===2?0.9:0.6;
    [[1,1],[2.76,.42],[5.4,.2],[8.93,.08]].forEach(([r,a])=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=f0*r; o.connect(g); g.connect(out); env(g,t,a,len/Math.sqrt(r)); o.start(t); o.stop(t+len+0.05); });
    const n=noise(), hp=c.createBiquadFilter(), ng=c.createGain(); hp.type='highpass'; hp.frequency.value=8000; n.connect(hp); hp.connect(ng); ng.connect(out); env(ng,t,0.35,0.06); n.start(t); n.stop(t+0.08);
    out.gain.value=G*0.55; }
  else if(sound==='hihat'){ const n=noise(), f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=lv===2?6000:7500; n.connect(f); f.connect(out); env(out,t,G*1.1,lv===2?0.12:lv===-1?0.03:0.05); n.start(t); n.stop(t+0.15); }
}
function clickAt(t,lv){                         // 나무 블록 같은 짧은 소리 (첫 박은 더 높게)
  const c=ctx, o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
  if(lv===-1){                                  // 나눈 박: 작고 낮게
    o.type='triangle'; o.frequency.setValueAtTime(940,t); o.frequency.exponentialRampToValueAtTime(700,t+0.04);
    f.type='bandpass'; f.frequency.value=1000; f.Q.value=1.2;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.06); return;
  }
  o.type='triangle'; o.frequency.setValueAtTime(lv===2?1760:lv===1?1480:1180,t); o.frequency.exponentialRampToValueAtTime(lv===2?1320:lv===1?1100:880,t+0.05);
  f.type='bandpass'; f.frequency.value=lv===2?1700:1200; f.Q.value=1.2;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(lv===2?0.9:lv===1?0.65:0.5,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
  o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.08);
}
function schedule(){
  const M=METERS[meter];
  while(nextT<ctx.currentTime+0.12){
    const n=subN();
    if(subI===0){ const lv=accOf()[beat%M.n]; hit(nextT,lv); }
    else hit(nextT,-1);
    queue.push({t:nextT,b:(beat%M.n)*n+subI,big:subI===0});
    nextT+=60/bpm/n; subI++;
    if(subI>=n){ subI=0; beat=(beat+1)%M.n; }
  }
}
function paint(){                                // 소리 나는 순간에 맞춰 박 표시
  const dots=$('beats').querySelectorAll('i');
  while(queue.length&&queue[0].t<=ctx.currentTime){
    const q=queue.shift();
    dots.forEach((d,i)=>d.classList.toggle('on',i===q.b));
    if(q.big){ const w=$('dialSurge'); w.classList.remove('surge'); void w.getBoundingClientRect(); w.classList.add('surge'); $('bpm').classList.remove('pulse'); void $('bpm').offsetWidth; $('bpm').classList.add('pulse'); }
  }
  raf=requestAnimationFrame(paint);
}
async function start(){
  audio(); running=true; beat=0; subI=0; queue=[]; nextT=ctx.currentTime+0.08;
  schedule(); timer=setInterval(schedule,25); raf=requestAnimationFrame(paint);
  $('startBtn').setAttribute('aria-label','멈춤'); $('dial').classList.add('run'); $('startIcon').innerHTML=$('startIcon2g').innerHTML='<path d="M3 2h4v12H3zM9 2h4v12H9z"/>';
  try{ if('wakeLock' in navigator) lock=await navigator.wakeLock.request('screen'); }catch(e){}
}
function stop(){
  running=false; clearInterval(timer); cancelAnimationFrame(raf); queue=[];
  $('beats').querySelectorAll('i').forEach(d=>d.classList.remove('on'));
  $('startBtn').setAttribute('aria-label','시작'); $('dial').classList.remove('run'); $('startIcon').innerHTML=$('startIcon2g').innerHTML='<path d="M4 2l10 6-10 6z"/>';
  try{ if(lock){ lock.release(); lock=null; } }catch(e){}
}
let taps=[];
function tap(){
  const now=performance.now(); taps=taps.filter(t=>now-t<2500); taps.push(now);
  if(taps.length>=2){ const iv=[]; for(let i=1;i<taps.length;i++) iv.push(taps[i]-taps[i-1]); const last=iv.slice(-4); setBpm(60000/(last.reduce((a,b)=>a+b,0)/last.length)); }
  $('tap').classList.remove('hit'); void $('tap').offsetWidth; $('tap').classList.add('hit');
}

PRESETS.forEach(v=>{ const b=document.createElement('button'); b.type='button'; b.dataset.v=v; b.textContent=v; $('presets').appendChild(b); });
Object.keys(METERS).forEach(m=>{ const b=document.createElement('button'); b.type='button'; b.dataset.v=m; b.textContent=m; $('meters').appendChild(b); });
SUBS.forEach(([v,t,svg])=>{ const b=document.createElement('button'); b.type='button'; b.dataset.v=v; b.innerHTML=svg; b.setAttribute('aria-label',t); $('subs').appendChild(b); });
$('subs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; sub=+b.dataset.v; subI=0; queue=[]; syncSubs(); drawBeats(); });
SOUNDS.forEach(([v,t])=>{ const b=document.createElement('button'); b.type='button'; b.dataset.v=v; b.textContent=t; $('sounds').appendChild(b); });
const syncSounds=()=>$('sounds').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===sound));
$('sounds').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; sound=b.dataset.v; try{ localStorage.setItem('mt-sound',sound); }catch(x){} syncSounds();
  if(!running){ audio(); const t=ctx.currentTime+0.03; hit(t,2); hit(t+0.35,0); }   // 멈춰 있으면 미리 들려줌
});
const syncMeter=()=>$('meters').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===meter));
$('presets').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setBpm(+b.dataset.v); });
$('beats').addEventListener('click',e=>{          // 큰 점: 보통 → 강박 → 보통 (중간 강박은 누르면 강박)
  const b=e.target.closest('.bt'); if(!b) return; const A=accOf(), i=+b.dataset.i;
  A[i]=A[i]===2?0:2; syncAcc(); drawBeats();
});
const syncAcc=()=>{ $('accent').checked=accOf()[0]===2; };   // "첫 박 강세" 스위치 = 1박이 강박인지 (점과 서로 맞춰짐)
$('accent').addEventListener('change',()=>{ accOf()[0]=$('accent').checked?2:0; drawBeats(); });
$('meters').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; meter=b.dataset.v; syncMeter(); syncSubs(); drawBeats(); syncAcc(); beat=0; subI=0; queue=[]; });
/* 다이얼: 호 길이·눈금 위치 그리기, 호를 누르거나 끌면 빠르기 바뀜 (가운데 숫자 쪽은 안 바뀜) */
function drawDial(){
  const C=2*Math.PI*136, t=(bpm-30)/220, a=(135+270*t)*Math.PI/180;
  $('dialVal').setAttribute('stroke-dasharray',(C*.75*t).toFixed(2)+' '+C.toFixed(2));
  const k=$('dialKnob'); k.setAttribute('cx',(150+136*Math.cos(a)).toFixed(1)); k.setAttribute('cy',(150+136*Math.sin(a)).toFixed(1));
  $('dialPtr').setAttribute('transform','rotate('+(270*t-135).toFixed(2)+' 150 150)');
  $('dial').style.setProperty('--wv',(240/bpm).toFixed(2)+'s');
  $('dialWater').style.transform='translateY('+(266-(.1+.8*t)*232).toFixed(1)+'px)';
  $('dialTicks').querySelectorAll('line').forEach(l=>l.classList.toggle('on',+l.dataset.v<=bpm));
  /* LED: 켜진 칸은 처음 약한 불 → 끝으로 갈수록 진한 불 (K 2026-11-25) */
  const led=[...$('dialLed').querySelectorAll('line')], lit=led.filter(l=>+l.dataset.v<=bpm), n=lit.length;
  led.forEach(l=>{ l.classList.remove('on','hot'); l.style.opacity=''; });
  lit.forEach((l,i)=>{ l.classList.add('on'); const f=n>1?i/(n-1):1; l.style.opacity=(0.22+0.78*Math.pow(f,1.4)).toFixed(2); if(i>=n-3) l.classList.add('hot'); });
}
(function(){ /* 바깥 눈금: 10 BPM마다 (50 단위는 조금 길게) */
  let h='';
  for(let v=30;v<=250;v+=10){ const a=(135+270*(v-30)/220)*Math.PI/180, r1=v%50===0?146:148, r2=154;
    h+='<line data-v="'+v+'" x1="'+(150+r1*Math.cos(a)).toFixed(1)+'" y1="'+(150+r1*Math.sin(a)).toFixed(1)+'" x2="'+(150+r2*Math.cos(a)).toFixed(1)+'" y2="'+(150+r2*Math.sin(a)).toFixed(1)+'"/>'; }
  $('dialTicks').innerHTML=h;
  h=''; /* LED 칸 45개 */
  for(let i=0;i<45;i++){ const v=30+220*i/44, a=(135+270*i/44)*Math.PI/180;
    h+='<line data-v="'+v.toFixed(1)+'" x1="'+(150+128*Math.cos(a)).toFixed(1)+'" y1="'+(150+128*Math.sin(a)).toFixed(1)+'" x2="'+(150+144*Math.cos(a)).toFixed(1)+'" y2="'+(150+144*Math.sin(a)).toFixed(1)+'"/>'; }
  $('dialLed').innerHTML=h;
  h=''; /* 공학 눈금: 2 BPM마다 짧은 눈금, 10마다 중간, 50마다 긴 눈금 + 숫자 */
  for(let v=30;v<=250;v+=2){ const a=(135+270*(v-30)/220)*Math.PI/180, L=v%50===0?12:v%10===0?7:4, r1=150;
    h+='<line class="'+(v%50===0?'mj':v%10===0?'md':'mn')+'" x1="'+(150+r1*Math.cos(a)).toFixed(1)+'" y1="'+(150+r1*Math.sin(a)).toFixed(1)+'" x2="'+(150+(r1+L)*Math.cos(a)).toFixed(1)+'" y2="'+(150+(r1+L)*Math.sin(a)).toFixed(1)+'"/>';
    if(v%50===0&&v<250) h+='<text x="'+(150+171*Math.cos(a)).toFixed(1)+'" y="'+(150+171*Math.sin(a)+4).toFixed(1)+'" text-anchor="middle">'+v+'</text>'; }
  $('dialScale').innerHTML=h;
  h=''; /* 눈송이 34개 (자리·크기·속도는 고정된 의사난수) */
  let sd=7; const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;
  for(let i=0;i<34;i++){ const x=(30+rnd()*240).toFixed(1), r=(1.4+rnd()*2.4).toFixed(1), k=(1.6+rnd()*2.2).toFixed(2), dl=(-rnd()*8).toFixed(2), sw=(4+rnd()*10).toFixed(1);
    h+='<circle cx="'+x+'" cy="0" r="'+r+'" style="--k:'+k+';--dl:'+dl+'s;--sw:'+sw+'px"/>'; }
  $('dialFlakes').innerHTML=h;
})();
(function(){
  const sv=$('dial').querySelector('svg'); let drag=false;
  function pick(e){
    const r=sv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*300-150, y=(e.clientY-r.top)/r.height*300-150;
    let rel=(Math.atan2(y,x)*180/Math.PI-135+720)%360;
    if(rel>270) rel=rel<315?270:0;
    setBpm(30+rel/270*220);
    return Math.hypot(x,y);
  }
  sv.addEventListener('pointerdown',e=>{
    const r=sv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*300-150, y=(e.clientY-r.top)/r.height*300-150;
    if(Math.hypot(x,y)<88) return;
    drag=true; sv.setPointerCapture(e.pointerId); pick(e); e.preventDefault();
  });
  sv.addEventListener('pointermove',e=>{ if(drag) pick(e); });
  sv.addEventListener('pointerup',()=>{ drag=false; });
  sv.addEventListener('pointercancel',()=>{ drag=false; });
})();
$('minus').onclick=()=>setBpm(bpm-1); $('plus').onclick=()=>setBpm(bpm+1);
$('startBtn').onclick=()=>running?stop():start();
$('tap').onclick=tap;
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,button')&&!e.target.closest('.bt')&&e.code==='Space') return;   // 점에 포커스가 있어도 스페이스는 시작/멈춤 (강박이 바뀌지 않게)
  if(e.code==='Space'){ e.preventDefault(); running?stop():start(); }
  if(e.code==='ArrowUp'){ e.preventDefault(); setBpm(bpm+1); }
  if(e.code==='ArrowDown'){ e.preventDefault(); setBpm(bpm-1); }
});
document.addEventListener('visibilitychange',async()=>{ if(running&&document.visibilityState==='visible'&&!lock){ try{ lock=await navigator.wakeLock.request('screen'); }catch(e){} } });

/* 설정 펼치기 (K 요청 2026-11-25): 소리·박자·음표를 접어 두고, 접힌 버튼에 지금 설정을 보여 줌. 처음엔 접힘 */
function moreSum(){
  const m=$('meters').querySelector('[aria-pressed="true"]'), so=$('sounds').querySelector('[aria-pressed="true"]'), su=$('subs').querySelector('[aria-pressed="true"]');
  $('moreSum').innerHTML=(m?m.textContent:'')+'<i></i>'+(so?so.textContent:'')+'<i></i>'+(su?su.innerHTML:'');
}
['meters','sounds','subs'].forEach(id=>$(id).addEventListener('click',()=>setTimeout(moreSum,0)));
$('moreBtn').onclick=()=>{ const open=$('more').hidden; $('more').hidden=!open; $('moreBtn').setAttribute('aria-expanded',open); };
setBpm(60); syncMeter(); syncSubs(); drawBeats(); syncAcc(); syncSounds(); moreSum();
})();
</script>
